<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WHWai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap">
<style>
:root{--sw:clamp(210px,26vw,280px);--frame:#bdbdbd;--side:#e6e6e6;--chip:#dcdcdc;--sel:#c9c9c9;--bub:#f1f1f1;--ink:#111;--mute:#666;--blue:#6aa0ff;--f:"Helvetica Neue",Inter,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.45 var(--f);color:var(--ink);background:#fff;padding:12px}
button,textarea{font:inherit;color:inherit}
svg{display:block}
.frame{height:100%;min-height:420px;border:5px solid var(--frame);border-radius:36px;display:flex;gap:16px;padding:12px;position:relative;overflow:hidden}
.side{width:var(--sw);flex:none;background:var(--side);border-radius:22px;padding:14px;display:flex;flex-direction:column;position:relative;transition:margin-left .32s cubic-bezier(.4,0,.2,1),opacity .22s ease}
.brand{display:flex;align-items:center;justify-content:space-between;padding:0 4px 12px;border-bottom:3px solid #c4c4c4;margin-bottom:12px}
.brand h1{font-size:26px;font-weight:400;margin:0}.brand b{font-weight:700}
.logo,.expand{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#9cc0ff,#4a7df0);border:0;padding:0;cursor:pointer;flex:none;transition:transform .15s}
.logo:hover,.expand:hover{transform:scale(1.07)}
.expand{position:absolute;left:4px;top:2px;z-index:4;opacity:0;pointer-events:none;transition:opacity .15s ease,transform .15s}
.list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:7px;padding-bottom:40px}
.hint{color:var(--mute);font-size:13.5px;padding:4px 6px}
.hint.warn{color:#7a4f00;background:#fff3d6;border-radius:10px;padding:8px 10px;margin-top:6px}
.row{position:relative;display:flex}
.chat{flex:1;min-width:0;border:0;text-align:left;background:var(--chip);border-radius:14px;padding:9px 36px 9px 13px;cursor:pointer;display:block;transition:background .15s,box-shadow .15s}
.ct{display:block;font-weight:500;line-height:1.3;overflow-wrap:anywhere}.ct svg{display:inline-block;vertical-align:-1px;margin-right:5px;opacity:.6}
.cm{display:block;font-size:12px;color:var(--mute);margin-top:3px}
.chat.edit{cursor:default;padding:7px 8px}
.rn{width:100%;border:0;outline:0;background:#fff;border-radius:9px;padding:6px 9px;font:inherit;font-weight:500;box-shadow:0 0 0 1.5px #9bb9f5}
.chat:hover{background:#d2d2d2}.chat.on{background:var(--sel);box-shadow:inset 0 0 0 1px #aaa}
.more{position:absolute;right:5px;top:50%;transform:translateY(-50%);border:0;background:none;width:26px;height:26px;border-radius:50%;cursor:pointer;color:#555;display:grid;place-items:center;padding:0;opacity:0;transition:opacity .15s,background .15s}
.row:hover .more,.row.on .more,.more:focus-visible,.more[aria-expanded=true]{opacity:1}.more:hover,.more[aria-expanded=true]{background:rgba(0,0,0,.1)}
.cmenu{position:absolute;right:12px;width:160px;background:#fff;border:1px solid #ddd;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.16);padding:5px;z-index:8;animation:rise .15s ease-out}
.cmenu[hidden]{display:none}
.cmenu button{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;border-radius:9px;padding:8px 10px;cursor:pointer;text-align:left}
.cmenu button:hover{background:#f0f0f0}.cmenu .danger{color:#d93b3b}
.new{position:absolute;right:12px;bottom:12px;width:30px;height:30px;border-radius:50%;border:0;background:#bbb;color:#fff;padding:0;display:grid;place-items:center;cursor:pointer;transition:background .15s}
.new:hover{background:#999}
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.menu{display:none;align-self:flex-start;border:0;background:var(--chip);border-radius:12px;padding:5px 12px;cursor:pointer;margin-bottom:8px}
.scroll{flex:1;overflow:auto;padding:14px 8px 112px;display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain;transition:padding-top .3s ease;scrollbar-width:thin;scrollbar-color:#cfcfcf transparent}
.scroll::-webkit-scrollbar{width:8px}.scroll::-webkit-scrollbar-thumb{background:#cfcfcf;border-radius:4px}
.msg{max-width:78%;background:var(--bub);border-radius:20px;padding:12px 16px;overflow-wrap:anywhere;flex:none}
.msg.u{align-self:flex-end;border-radius:26px;padding:13px 24px;white-space:pre-wrap}
.msg.dim{color:#777}
.msg p{margin:0 0 8px}.msg p:last-child{margin:0}.msg ul{margin:0 0 8px;padding-left:18px}.msg li{margin-bottom:4px}
.msg pre{margin:0 0 8px;padding:10px 12px;background:#e4e4e4;border-radius:12px;overflow:auto;white-space:pre;font-size:13.5px;line-height:1.5}.msg pre:last-child{margin:0}
.msg code{background:#e4e4e4;border-radius:6px;padding:1px 5px;font-size:.92em}
.fresh{animation:rise .35s cubic-bezier(.2,.7,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.bar{align-self:flex-start;display:flex;align-items:center;gap:2px;background:var(--bub);border-radius:18px;padding:3px 12px 3px 6px;margin-top:-8px;flex:none}
.bar button{border:0;background:none;padding:5px;cursor:pointer;border-radius:8px;display:grid;place-items:center}
.bar button:hover{background:#ddd}.bar span{margin-left:70px;font-size:13px;color:#333}
.empty{margin:auto;text-align:center;color:var(--mute)}.empty h2{font-size:28px;font-weight:400;color:var(--ink);margin:0 0 6px}
.orb{position:absolute;right:26px;bottom:calc(100% + 22px);z-index:3;width:68px;height:68px;border-radius:50%;background:#78a4fa;box-shadow:0 0 0 6px rgba(120,164,250,.38);pointer-events:none;will-change:transform}
.orb.think{animation:breathe 3s ease-in-out infinite,morph 4.6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:translate(0,0) scale(.94) rotate(0);box-shadow:0 0 0 5px rgba(120,164,250,.42)}25%{transform:translate(-3px,-6px) scale(1.04) rotate(10deg)}50%{transform:translate(0,-11px) scale(1.1) rotate(22deg);box-shadow:0 0 0 14px rgba(120,164,250,.12)}75%{transform:translate(3px,-4px) scale(1.02) rotate(8deg)}}
@keyframes morph{0%,100%{border-radius:50%}25%{border-radius:62% 38% 54% 46%/46% 58% 42% 54%}50%{border-radius:44% 56% 40% 60%/58% 42% 58% 42%}75%{border-radius:54% 46% 62% 38%/40% 60% 46% 54%}}
.input{display:flex;gap:10px;align-items:flex-end;position:relative}
.field{flex:1;display:flex;align-items:flex-end;background:var(--bub);border-radius:26px;padding:0 14px 0 20px;min-height:50px}
.field textarea{flex:1;border:0;background:none;outline:0;resize:none;min-width:0;padding:14px 0;max-height:120px;line-height:22px;height:50px}
.mwrap{position:relative;align-self:center;margin-left:8px}
.model{border:0;background:none;font-weight:700;cursor:pointer;white-space:nowrap;padding:6px;border-radius:10px;display:flex;align-items:center;gap:5px}
.model:hover{background:#e4e4e4}
.pop{position:absolute;right:0;bottom:calc(100% + 14px);width:240px;background:#fff;border:1px solid #ddd;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.16);padding:6px;z-index:10;animation:rise .15s ease-out}
.pop[hidden]{display:none}
.pop .ph{font-size:12.5px;color:var(--mute);padding:6px 10px 4px}
.mi{display:flex;width:100%;align-items:center;gap:8px;border:0;background:#f3f3f3;border-radius:11px;padding:8px 10px;cursor:pointer;text-align:left}
.mi div{flex:1}.mi small{display:block;color:var(--mute);font-size:12.5px}.mi i{display:flex;color:var(--blue)}
.round{width:48px;height:48px;border-radius:50%;border:0;background:var(--bub);cursor:pointer;flex:none;display:grid;place-items:center;transition:background .15s,opacity .15s;margin-bottom:1px}
.round:hover{background:#e2e2e2}.round:disabled{opacity:.45;cursor:default}
.note{font-size:13px;margin:8px 0 0 4px}
.toast{position:absolute;left:50%;bottom:64px;transform:translate(-50%,8px);background:#222;color:#fff;border-radius:14px;padding:7px 14px;font-size:13.5px;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;z-index:9}
.toast.show{opacity:1;transform:translate(-50%,0)}
.scrim{display:none;position:absolute;inset:0;background:rgba(0,0,0,.25);z-index:5}
.gear{position:absolute;left:12px;bottom:12px;width:30px;height:30px;border-radius:50%;border:0;background:#bbb;color:#fff;padding:0;display:grid;place-items:center;cursor:pointer;transition:background .15s}
.gear:hover{background:#999}
.modal{position:absolute;inset:0;background:rgba(0,0,0,.28);display:grid;place-items:center;z-index:20;animation:rise .2s ease-out}
.modal[hidden]{display:none}
.mcard{width:min(420px,92%);max-height:88%;overflow:auto;background:#fff;border-radius:22px;padding:18px 20px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;font-size:18px}
.mh button{border:0;background:var(--bub);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:18px;line-height:1;padding:0}
.mcard h3{margin:10px 0 6px;font-size:16px}.mcard p{margin:0 0 10px}.sm{font-size:13px;color:var(--mute)}
.key{display:flex;align-items:center;justify-content:space-between;background:var(--bub);border-radius:14px;padding:10px 14px;margin-bottom:10px;font-size:26px;font-weight:700;letter-spacing:.12em}
.key button{border:0;background:none;cursor:pointer;padding:6px;border-radius:8px;display:grid;place-items:center}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.pbtn{border:0;background:var(--chip);border-radius:12px;padding:8px 14px;cursor:pointer;font-weight:500;transition:background .15s}
.pbtn:hover{background:#cfcfcf}.pbtn.danger{color:#d93b3b}
.join{display:flex;gap:8px;margin-bottom:6px}.join input{flex:1;min-width:0;border:0;outline:0;background:var(--bub);border-radius:12px;padding:9px 12px;font:inherit;letter-spacing:.1em}
.no-anim,.no-anim *{transition:none!important}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media (min-width:641px){.frame.collapsed .side{margin-left:calc(-1 * var(--sw) - 16px);opacity:0;visibility:hidden;transition:margin-left .32s cubic-bezier(.4,0,.2,1),opacity .2s ease,visibility 0s .32s}.frame.collapsed .expand{opacity:1;pointer-events:auto;transition:opacity .25s ease .15s}.frame.collapsed .scroll{padding-top:50px}}
@media (max-width:640px){
 body{padding:6px}.frame{border-width:3px;border-radius:24px;padding:8px}
 .side{position:absolute;z-index:6;left:8px;top:8px;bottom:8px;width:min(260px,82%);transform:translateX(-110%);visibility:hidden;transition:transform .25s ease,visibility 0s .25s;box-shadow:0 8px 30px rgba(0,0,0,.25)}
 .side.open{transform:none;visibility:visible;transition:transform .25s ease}
 .scrim.show{display:block}.expand{opacity:1;pointer-events:auto}.scroll{padding-top:50px}.msg{max-width:94%}
 .orb{width:54px;height:54px;right:24px}.bar span{margin-left:24px}.field textarea{font-size:16px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@supports (height:100dvh){html,body{height:100dvh}}
button,.chat{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.model .sep{margin-right:1px}
@media (hover:none){.more{opacity:1}.chat:hover{background:var(--chip)}.chat.on:hover{background:var(--sel)}}
@media (max-width:640px){
 body{padding:4px}
 .frame{min-height:0;border-width:2px;border-radius:20px;padding:6px}
 .scroll{padding:50px 4px 84px;gap:12px}
 .msg{max-width:92%}.msg.u{padding:11px 18px}
 .input{gap:6px}
 .field{min-height:46px;padding:0 6px 0 16px;border-radius:23px}
 .field textarea{padding:12px 0;height:46px}
 #clip{display:none}
 .round{width:44px;height:44px}
 .model{padding:6px 4px;font-size:13.5px}.model .sep{display:none}
 .orb{width:46px;height:46px;right:16px;bottom:calc(100% + 14px)}
 .pop{width:min(240px,calc(100vw - 32px))}
 .note{font-size:12px;margin:6px 0 0 6px}
 .bar span{margin-left:16px;font-size:12px}
 .mcard{padding:16px}.key{font-size:22px}
}
.mbar{display:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
.chip{border:0;background:var(--bub);border-radius:16px;padding:9px 14px;cursor:pointer;font-size:14px;color:var(--ink);transition:background .15s}
.chip:hover{background:#e6e6e6}
@keyframes glow{0%,100%{box-shadow:-6px 4px 20px rgba(106,160,255,.35),6px 4px 20px rgba(244,114,182,.22),0 -4px 20px rgba(167,139,250,.22)}50%{box-shadow:6px 6px 28px rgba(106,160,255,.5),-6px 2px 28px rgba(244,114,182,.38),0 -6px 26px rgba(251,191,36,.28)}}
@media (max-width:640px){
 body{padding:0;background:radial-gradient(120% 50% at 50% 108%,rgba(120,150,255,.2),transparent 70%),#fff}
 .frame{border:0;border-radius:0;padding:0;gap:0;background:transparent}
 .main{padding:0 0 0}
 .mbar{display:flex;align-items:center;justify-content:center;position:absolute;left:0;right:0;top:0;height:calc(52px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);z-index:3;background:rgba(255,255,255,.74);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);border-bottom:1px solid rgba(0,0,0,.06)}
 .mt{font-size:17px;font-weight:500}.mt b{font-weight:700}
 .mnew{position:absolute;right:12px;bottom:9px;width:34px;height:34px;border:0;border-radius:50%;background:rgba(0,0,0,.06);display:grid;place-items:center;padding:0;cursor:pointer}
 .expand{left:12px;top:calc(9px + env(safe-area-inset-top));z-index:4}
 .scroll{padding:calc(64px + env(safe-area-inset-top)) 14px 72px;gap:10px}
 .msg{max-width:84%;background:#f0f0f3;border-radius:20px;padding:10px 15px}
 .msg.u{background:linear-gradient(180deg,#7fa9ff,#5b8df0);color:#fff;border-radius:20px;padding:10px 15px}
 .bar{background:none;padding:0 4px;margin-top:-6px}
 .input{margin:0 10px}
 .field{background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);border:1px solid rgba(255,255,255,.95);min-height:48px;border-radius:24px;box-shadow:-6px 4px 20px rgba(106,160,255,.35),6px 4px 20px rgba(244,114,182,.22),0 -4px 20px rgba(167,139,250,.22)}
 .busy .field{animation:glow 2.4s ease-in-out infinite}
 .round{background:rgba(255,255,255,.88);box-shadow:0 2px 12px rgba(106,160,255,.25)}
 .note{text-align:center;margin:6px 0 calc(8px + env(safe-area-inset-bottom))}
 .side{background:rgba(238,238,242,.94);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px)}
 .empty h2{font-size:32px}
}
</style>
</head>
<body>
<div class="frame">
 <aside class="side" id="side">
  <div class="brand"><h1>WHW<b>ai</b></h1><button class="logo" id="logo" title="Collapse sidebar" aria-label="Collapse sidebar"></button></div>
  <div class="list" id="list"></div>
  <button class="new" id="new" title="New chat" aria-label="New chat">+</button>
  <button class="gear" id="gear" title="Settings" aria-label="Settings"></button>
  <div class="cmenu" id="cmenu" role="menu" hidden><button id="cren" role="menuitem"></button><button id="cpin" role="menuitem"></button><button id="cdel" class="danger" role="menuitem"></button></div>
 </aside>
 <div class="scrim" id="scrim"></div>
 <div class="modal" id="modal" hidden><div class="mcard" role="dialog" aria-label="Settings"><div class="mh"><b>Settings</b><button id="mx" aria-label="Close">&times;</button></div><div id="mbody"></div></div></div>
 <section class="main">
  <button class="expand" id="expand" title="Show sidebar" aria-label="Show sidebar"></button>
  <div class="mbar"><span class="mt">WHW<b>ai</b></span><button class="mnew" id="mnew" title="New chat" aria-label="New chat"></button></div>
  <div class="scroll" id="chat"></div>
  <div class="toast" id="toast" role="status"></div>
  <div class="input">
   <div class="orb" id="orb" aria-hidden="true"></div>
   <div class="field">
    <textarea id="in" rows="1" placeholder="Message WHWai" aria-label="Message"></textarea>
    <div class="mwrap">
     <button class="model" id="model" aria-haspopup="menu" aria-expanded="false"></button>
     <div class="pop" id="pop" role="menu" hidden>
      <div class="ph">Model</div>
      <button class="mi" id="mi" role="menuitemradio" aria-checked="true"><div>Aries 1<small>Powered by OpenAI</small></div><i id="tick"></i></button>
     </div>
    </div>
   </div>
   <button class="round" id="clip" title="Attach" aria-label="Attach"></button>
   <button class="round" id="send" title="Send" aria-label="Send"></button>
  </div>
  <div class="note">WHW<b>ai</b> is not human and can make mistakes.</div>
 </section>
</div>

const RULES=[
 [/coffee|shop|marketing|customers|business/,`For a local coffee shop, your best marketing is usually hyper-local and relationship-driven, which is also the cheapest kind. Here are a few things worth trying:\n\n- **Start a simple loyalty program.** A punch card gives regulars a reason to come back and costs almost nothing to run.\n- **Partner with nearby businesses.** Offer a discount to employees of the office next door, or swap flyers with a bookstore or gym.\n- **Make your Google Business Profile shine.** Fresh photos, accurate hours, and steady reviews matter more than almost any ad.\n- **Post behind-the-scenes content.** Latte art and new menu items build familiarity for free.\n\nIf you only have time for two, start with the Google Business Profile and a loyalty program.`],
 [/meal|prep|dinner|lunch|cook/,`Meal prep works best when you keep it simple:\n\n- **Cook two proteins and two grains** on Sunday, then mix them all week.\n- **Chop vegetables** right after shopping so they get used.\n- **Freeze one portion** of everything as a backup.\n\nWant a shopping list for five lunches?`],
 [/python|bug|error|code|script/,`Paste the script and the full error message and I'll walk through it. In the meantime, check these first:\n\n- **The last line of the traceback** names the real problem.\n- **Indentation and typos** cause most beginner errors.\n- **Print the variable** just before the line that fails.`],
 [/resume|cv|job/,`Happy to review it. Good resumes lead with results, so for each job, swap duties for outcomes ("cut wait times by 20%" beats "answered phones"). Paste your resume and tell me the role you're aiming for.`],
 [/japan|trip|travel|tokyo|kyoto/,`Japan is great for a first visit of 10 days or so:\n\n- **Tokyo (4 nights):** neighborhoods, food, day trips.\n- **Kyoto (3 nights):** temples and gardens.\n- **Osaka (2 nights):** street food and nightlife.\n\nWhen are you thinking of going?`],
 [/stock|invest|money/,`I can explain how stocks and funds work, but I can't tell you what to buy. Tell me your time horizon and how much risk you're comfortable with and I'll lay out the common options.`],
 [/^(hi|hello|hey)\b|who are you|your name/,`Hi! I'm Aries 1, the model behind WHWai. Ask me about marketing, meal plans, code, or trip planning.`]
];
const FALLBACK=`That's an interesting question. This demo only knows a few topics, but the real version will answer anything. Try asking about **marketing**, **meal prep**, **Python**, **resumes**, or **a trip**.`;

let S=null;
try{S=JSON.parse(store.get()||"null")}catch(e){}
if(!S||!Array.isArray(S.chats))S={chats:[],cur:null};
if(S.cur&&!S.chats.some(c=>c.id===S.cur))S.cur=null;
if(!Array.isArray(S.dead))S.dead=[];
const clean=()=>({chats:S.chats.map(c=>({...c,m:c.m.filter(m=>!m.err).map(({_l,...r})=>r)})),dead:S.dead});
const save=ns=>{store.set(JSON.stringify({...S,...clean()}));if(!ns&&S.key)syncSoon()};
const C=()=>S.chats.find(c=>c.id===S.cur)||null;
const sorted=()=>[...S.chats].sort((a,b)=>(b.p?1:0)-(a.p?1:0)||b.u-a.u);

const chatEl=$("chat"),ta=$("in"),orb=$("orb"),list=$("list"),sendBtn=$("send");
let busy=false;
if(LOGO)document.querySelectorAll(".logo,.expand").forEach(l=>l.style.background="url("+LOGO+") center/cover no-repeat");

const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function md(s){
 const inl=t=>esc(t).replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
 const blocks=t=>t.split(/\n\n+/).filter(b=>b.trim()).map(b=>{
  const ls=b.split("\n");
  if(ls.every(l=>/^[-*] /.test(l)))return"<ul>"+ls.map(l=>"<li>"+inl(l.slice(2))+"</li>").join("")+"</ul>";
  return"<p>"+ls.map(inl).join("<br>")+"</p>";
 }).join("");
 return s.split(/```[\w+-]*\n?([\s\S]*?)(?:```|$)/).map((p,i)=>i%2?"<pre>"+esc(p.replace(/\n+$/,""))+"</pre>":blocks(p)).join("");
}
function ago(t){
 const m=Math.floor((Date.now()-t)/MIN);
 if(m<1)return"just now";if(m<60)return m+(m===1?" minute ago":" minutes ago");
 const h=Math.floor(m/60);if(h<24)return h+(h===1?" hour ago":" hours ago");
 const d=Math.floor(h/24);if(d<7)return d+(d===1?" day ago":" days ago");
 return new Date(t).toLocaleDateString();
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const near=()=>chatEl.scrollHeight-chatEl.scrollTop-chatEl.clientHeight<140;
const toBottom=()=>chatEl.scrollTo({top:chatEl.scrollHeight});

const PIN='<path d="M12 17v5"/><path d="M9 3h6l-1 7 3 3v2H7v-2l3-3z"/>',
 TRASH='<path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/>',
 DOTS='<circle cx="5" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.7" fill="currentColor" stroke="none"/>';
const PEN='<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>';
let renamingId=null;
let mid=null;
function renderList(){
 list.innerHTML="";closeMenu();
 if(!S.chats.length)list.insertAdjacentHTML("beforeend",'<div class="hint">Your chats will show up here.</div>');
 sorted().forEach(c=>{
  if(renamingId===c.id){
   const e=document.createElement("div");e.className="chat on edit";
   const i=document.createElement("input");i.className="rn";i.value=c.t;i.maxLength=60;i.setAttribute("aria-label","Chat name");
   let done=0;
   const fin=ok=>{if(done)return;done=1;const v=i.value.trim();if(ok&&v){c.t=v.slice(0,60);c.auto=0;touch(c);save()}renamingId=null;renderList()};
   i.onkeydown=ev=>{if(ev.key==="Enter")fin(true);else if(ev.key==="Escape")fin(false)};
   i.onblur=()=>fin(true);
   e.appendChild(i);list.appendChild(e);return;
  }
  const on=c.id===S.cur,r=document.createElement("div");r.className="row"+(on?" on":"");
  const b=document.createElement("button");b.className="chat"+(on?" on":"");b.title=c.t;
  b.innerHTML='<span class="ct">'+(c.p?ic(PIN,12):"")+esc(c.t)+'</span><span class="cm" data-t="'+c.u+'">'+ago(c.u)+'</span>';
  b.onclick=()=>openChat(c.id);
  const x=document.createElement("button");x.className="more";x.innerHTML=ic(DOTS,18);x.title="Chat options";
  x.setAttribute("aria-label","Chat options");x.setAttribute("aria-haspopup","menu");x.setAttribute("aria-expanded","false");
  x.onclick=e=>{e.stopPropagation();if(mid===c.id)closeMenu();else openMenu(c.id,x)};
  r.append(b,x);list.appendChild(r);
 });
 if(!canSave)list.insertAdjacentHTML("beforeend",'<div class="hint warn">Chats can\'t be saved in this browser, so they will be lost when you leave this page.</div>');
}
function openMenu(id,btn){
 const c=S.chats.find(x=>x.id===id);if(!c)return;
 closeMenu();mid=id;
 const m=$("cmenu");
 $("cren").innerHTML=ic(PEN,16)+"<span>Rename</span>";
 $("cpin").innerHTML=ic(PIN,16)+"<span>"+(c.p?"Unpin":"Pin")+"</span>";
 $("cdel").innerHTML=ic(TRASH,16)+"<span>Delete</span>";
 m.hidden=false;
 const sr=$("side").getBoundingClientRect(),br=btn.getBoundingClientRect();
 m.style.top=Math.max(8,Math.min(br.bottom-sr.top+4,sr.height-m.offsetHeight-8))+"px";
 btn.setAttribute("aria-expanded","true");
}
function closeMenu(){
 $("cmenu").hidden=true;mid=null;
 document.querySelectorAll(".more").forEach(b=>b.setAttribute("aria-expanded","false"));
}
function renderChat(fresh){
 const c=C();chatEl.innerHTML="";
 if(!c||!c.m.length){const SUG=["Explain something simply","Help me plan a trip","Help me fix my code","Write a short message for me"];
  chatEl.innerHTML='<div class="empty"><h2>WHW<b>ai</b></h2>Ask anything to get started.<div class="chips">'+SUG.map(t=>'<button class="chip">'+t+'</button>').join("")+'</div></div>';
  chatEl.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{ta.value=b.textContent;fit();send()});return}
 c.m.forEach((m,i)=>{
  const d=document.createElement("div");d.className="msg"+(m.r==="u"?" u":"");
  if(m.r==="u")d.textContent=m.x;else d.innerHTML=md(m.x);
  chatEl.appendChild(d);
  if(m.r==="a"){
   const canRegen=i===c.m.length-1&&m._l,b=document.createElement("div");b.className="bar";
   b.innerHTML='<button class="cp" title="Copy" aria-label="Copy">'+I.copy+'</button>'+(canRegen?'<button class="rg" title="Regenerate" aria-label="Regenerate">'+I.regen+'</button>':'')+'<span data-t="'+m.at+'">'+ago(m.at)+'</span>';
   const cp=b.querySelector(".cp"),rg=b.querySelector(".rg");
   cp.onclick=()=>copy(m.x,cp);if(rg)rg.onclick=regen;
   chatEl.appendChild(b);
  }
 });
 if(fresh){const ms=chatEl.querySelectorAll(".msg");ms[ms.length-1].classList.add("fresh")}
 toBottom();
}
const plain=t=>t.replace(/\*\*(.+?)\*\*/g,"$1").replace(/^[-*] /gm,"\u2022 ");
async function copy(t,btn){
 const ok=()=>{btn.innerHTML=I.check;setTimeout(()=>btn.innerHTML=I.copy,1200)};
 try{
  if(window.ClipboardItem&&navigator.clipboard&&navigator.clipboard.write){
   await navigator.clipboard.write([new ClipboardItem({"text/plain":new Blob([plain(t)],{type:"text/plain"}),"text/html":new Blob([md(t)],{type:"text/html"})})]);
   return ok();
  }
  await navigator.clipboard.writeText(plain(t));return ok();
 }catch(e){}
 const a=document.createElement("textarea");a.value=plain(t);a.style.cssText="position:fixed;top:0;opacity:0";
 document.body.appendChild(a);a.focus();a.select();a.setSelectionRange(0,a.value.length);
 try{if(document.execCommand("copy"))ok()}catch(e){}
 a.remove();
}
function orbStart(){orb.style.transition="";orb.classList.add("think")}
function orbStop(){
 if(!orb.classList.contains("think"))return;
 const cs=getComputedStyle(orb),t=cs.transform,br=cs.borderRadius,bs=cs.boxShadow;
 orb.classList.remove("think");
 orb.style.transition="none";orb.style.transform=t;orb.style.borderRadius=br;orb.style.boxShadow=bs;
 void orb.offsetWidth;
 orb.style.transition="transform 1s cubic-bezier(.25,.8,.25,1),border-radius 1s ease,box-shadow 1s ease";
 orb.style.transform="";orb.style.borderRadius="";orb.style.boxShadow="";
}
function setBusy(b){busy=b;sendBtn.disabled=b;document.querySelector(".frame").classList.toggle("busy",b);b?orbStart():orbStop()}
const ERR_TEXT="WHWai is busy or can't be reached right now. Wait a moment, then press regenerate.";
const hist=c=>c.m.filter(m=>!m.err).slice(-14).map(m=>({r:m.r,x:m.x}));
async function post(body){
 const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),45000);
 try{
  const r=await fetch(API_URL,{method:"POST",body:JSON.stringify(body),signal:ctl.signal});
  const j=await r.json();if(j.error)throw new Error(j.error);return j;
 }finally{clearTimeout(tm)}
}
async function genTitle(c){
 try{
  const j=await post({action:"title",messages:hist(c).slice(0,2)});
  const t=(j.text||"").split("\n")[0].replace(/["*.]+/g,"").trim().slice(0,40);
  if(t&&c.auto){c.t=t;c.auto=0;touch(c);save();renderList()}
 }catch(e){}
}
async function answer(c,q){
 setBusy(true);
 const tmp=document.createElement("div");tmp.className="msg dim fresh";tmp.textContent="Thinking…";chatEl.appendChild(tmp);toBottom();
 let full,err=0;
 if(API_URL){try{const j=await post({action:"chat",model:"aries-1",messages:hist(c)});full=j.text||ERR_TEXT;if(!j.text||j.disabled)err=1}catch(e){full=ERR_TEXT;err=1}}
 else{await sleep(800+Math.random()*700);full=(RULES.find(([r])=>r.test(q.toLowerCase()))||[0,FALLBACK])[1]}
 const w=full.split(/(\s+)/),step=Math.max(2,Math.ceil(w.length/300));let out="";
 for(let i=0;i<w.length;i++){
  out+=w[i];
  if(i%step===0){tmp.classList.remove("dim");tmp.innerHTML=md(out);if(near())toBottom();await sleep(22)}
 }
 c.m.push(err?{r:"a",x:full,at:Date.now(),_l:1,err:1}:{r:"a",x:full,at:Date.now(),_l:1});c.u=Date.now();touch(c);save();renderList();
 if(API_URL&&!err&&c.auto&&c.m.length<=2)genTitle(c);
 setBusy(false);renderChat();
}
/* demo title: first few words. The real version should ask the AI for a 3-5 word summary instead. */
function makeTitle(q){
 const w=q.replace(/[?!.]+$/,"").split(/\s+/).slice(0,5).join(" ");
 const t=w.charAt(0).toUpperCase()+w.slice(1);
 return t.length>30?t.slice(0,29)+"…":t;
}
function send(){
 const q=ta.value.trim();if(!q||busy)return;
 ta.value="";fit();let c=C();
 if(!c){c={id:uid(),t:makeTitle(q),auto:1,u:Date.now(),m:[]};S.chats.push(c);S.cur=c.id}
 c.m.push({r:"u",x:q,at:Date.now()});
 c.u=Date.now();touch(c);save();renderList();renderChat(true);answer(c,q);
}
function regen(){
 const c=C();if(busy||!c)return;c.m.pop();touch(c);
 const q=[...c.m].reverse().find(m=>m.r==="u");save();renderChat();if(q)answer(c,q.x);
}
function openChat(id){if(busy)return;S.cur=id;save();renderList();renderChat();side(false)}
function newChat(){if(busy)return;S.cur=null;save();renderList();renderChat();side(false);ta.focus()}
function delChat(id){
 if(busy)return;S.chats=S.chats.filter(c=>c.id!==id);S.dead.push({id,mu:Date.now()});
 if(S.cur===id)S.cur=null;
 save();renderList();renderChat();
}
function side(open){$("side").classList.toggle("open",open);$("scrim").classList.toggle("show",open)}
function fit(){ta.style.height="auto";ta.style.height=Math.min(ta.scrollHeight,120)+"px"}
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove("show"),2200)}
function pop(open){$("pop").hidden=!open;$("model").setAttribute("aria-expanded",open)}

sendBtn.onclick=send;
ta.addEventListener("input",fit);
ta.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}});
$("new").onclick=newChat;
const mob=()=>matchMedia("(max-width:640px)").matches;
function collapse(c){S.col=c;document.querySelector(".frame").classList.toggle("collapsed",c);save()}
$("logo").onclick=()=>mob()?side(false):collapse(true);
$("expand").onclick=()=>mob()?side(true):collapse(false);
$("cren").onclick=()=>{const id=mid;closeMenu();renamingId=id;renderList();const i=list.querySelector(".rn");if(i){i.focus();i.select()}};
$("cpin").onclick=()=>{const c=S.chats.find(x=>x.id===mid);if(c){c.p=!c.p;touch(c);save();renderList()}else closeMenu()};
$("cdel").onclick=()=>{const id=mid;closeMenu();delChat(id)};
list.addEventListener("scroll",closeMenu);
document.addEventListener("click",e=>{if(!$("cmenu").contains(e.target))closeMenu()});
$("scrim").onclick=()=>side(false);
$("clip").onclick=()=>toast("Attachments aren't available yet.");
$("model").onclick=e=>{e.stopPropagation();pop($("pop").hidden)};
$("mi").onclick=()=>pop(false);
document.addEventListener("click",e=>{if(!$("pop").contains(e.target))pop(false)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){pop(false);side(false);closeMenu();modal.hidden=true}});
/* ---------- settings + sync ---------- */
const KEYLEN=6; /* must match KEY_DIGITS in the backend script */
const SLIDERS='<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>';
$("gear").innerHTML=ic(SLIDERS,16,2.2);
$("mnew").innerHTML=ic('<path d="M12 5v14M5 12h14"/>',18,2.4);$("mnew").onclick=newChat;
const modal=$("modal"),mbody=$("mbody");
let syncing=false,st=null,smsg="";
const touch=c=>{c.mu=Date.now()};
function merge(a,b){
 const map={},dead={},t=c=>c.mu||c.u||0;
 [a,b].forEach(s=>{
  (s.dead||[]).forEach(d=>{if(!(d.id in dead)||dead[d.id]<d.mu)dead[d.id]=d.mu});
  (s.chats||[]).forEach(c=>{const x=map[c.id];if(!x||t(c)>t(x))map[c.id]=c});
 });
 return{chats:Object.values(map).filter(c=>!(c.id in dead)||dead[c.id]<t(c)),dead:Object.keys(dead).map(id=>({id,mu:dead[id]}))};
}
function applyRemote(j){
 const sig=()=>JSON.stringify(S.chats.map(c=>[c.id,c.mu||c.u,c.t,c.p]));
 const before=sig(),m=merge({chats:S.chats,dead:S.dead},{chats:j.chats||[],dead:j.dead||[]});
 S.chats=m.chats;S.dead=m.dead;
 if(S.cur&&!S.chats.some(c=>c.id===S.cur))S.cur=null;
 if(sig()!==before){renderList();renderChat()}
}
const errText=e=>({badkey:"That key wasn't found.",slow:"Too many attempts. Wait a minute and try again.",toobig:"Your chats are too large to sync.",busy:"The server is busy. Try again soon."}[e&&e.message]||"Couldn't reach the server. Try again.");
async function doSync(msg){
 if(!S.key||syncing)return;syncing=true;
 try{const j=await post({action:"sync",key:S.key,...clean()});applyRemote(j);S.last=Date.now();save(1);if(msg)smsg=msg}
 catch(e){
  if(e&&e.message==="badkey"){S.key=null;S.last=0;save(1);smsg="This key is no longer valid, so sync was turned off."}
  else if(msg)smsg=errText(e);
 }
 finally{syncing=false;if(!modal.hidden)renderSettings()}
}
function syncSoon(){clearTimeout(st);st=setTimeout(()=>{busy?syncSoon():doSync()},2500)}
function setMsg(t){smsg=t;const m=mbody.querySelector("#s-msg");if(m)m.textContent=t}
function renderSettings(){
 const on=!!S.key,k=S.key||"";
 mbody.innerHTML=on?
 '<h3>Sync across devices</h3><p>Sync is on. Your key:</p><div class="key"><span>'+k.replace(/(\d{3})(?=\d)/g,"$1 ")+'</span><button id="s-copy" title="Copy key" aria-label="Copy key">'+I.copy+'</button></div><p class="sm">On another device, open Settings and enter this key under Connect. Anyone who has this key can read your synced chats, so keep it private.</p><p class="sm">'+(S.last?"Last synced "+ago(S.last):"Not synced yet")+'</p><div class="btns"><button class="pbtn" id="s-now">Sync now</button><button class="pbtn" id="s-off">Turn off on this device</button><button class="pbtn danger" id="s-del">Delete synced copy</button></div>':
 '<h3>Sync across devices</h3><p>Your chats stay on this device until you turn sync on. With sync on, a copy is stored on the WHWai server so you can open your chats on other devices.</p><div class="btns"><button class="pbtn" id="s-on">Turn on sync</button></div><p class="sm">Already have a key?</p><div class="join"><input id="s-key" inputmode="numeric" autocomplete="off" maxlength="'+KEYLEN+'" placeholder="'+KEYLEN+'-digit key" aria-label="Sync key"><button class="pbtn" id="s-join">Connect</button></div>';
 mbody.insertAdjacentHTML("beforeend",'<p class="sm" id="s-msg" role="status"></p>');
 setMsg(smsg);
 const q=id=>mbody.querySelector("#"+id);
 if(on){
  q("s-copy").onclick=()=>copy(S.key,q("s-copy"));
  q("s-now").onclick=()=>{setMsg("Syncing…");doSync("Synced just now.")};
  q("s-off").onclick=()=>{S.key=null;S.last=0;save(1);smsg="Sync is off on this device. Your chats here are untouched.";renderSettings()};
  q("s-del").onclick=async()=>{
   const b=q("s-del");
   if(!b.dataset.arm){b.dataset.arm=1;b.textContent="Click again to delete";setTimeout(()=>{if(b.isConnected){b.dataset.arm="";b.textContent="Delete synced copy"}},3000);return}
   try{await post({action:"sync_delete",key:S.key});S.key=null;S.last=0;save(1);smsg="Synced copy deleted. Your chats on this device are untouched.";renderSettings()}catch(e){setMsg(errText(e))}
  };
 }else{
  q("s-on").onclick=async()=>{
   setMsg("Turning on…");
   try{const j=await post({action:"sync_new"});S.key=j.key;save(1);await doSync("Sync is on.");renderSettings()}catch(e){setMsg(errText(e))}
  };
  q("s-join").onclick=async()=>{
   const k=q("s-key").value.replace(/\D/g,"");
   if(k.length!==KEYLEN)return setMsg("Enter your "+KEYLEN+"-digit key.");
   setMsg("Connecting…");
   try{const j=await post({action:"sync",key:k,...clean()});S.key=k;applyRemote(j);S.last=Date.now();save(1);smsg="Connected. Your chats are now synced.";renderSettings()}catch(e){setMsg(errText(e))}
  };
 }
}
$("gear").onclick=()=>{smsg="";renderSettings();modal.hidden=false};
$("mx").onclick=()=>{modal.hidden=true};
modal.onclick=e=>{if(e.target===modal)modal.hidden=true};
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S.key&&!busy)doSync()});
setInterval(()=>document.querySelectorAll(".bar span,.cm").forEach(s=>s.textContent=ago(+s.dataset.t)),30000);
const fr=document.querySelector(".frame");fr.classList.add("no-anim");fr.classList.toggle("collapsed",!!S.col);
requestAnimationFrame(()=>requestAnimationFrame(()=>fr.classList.remove("no-anim")));
renderList();renderChat();
if(S.key)doSync();
</script>
