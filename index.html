/* ---------- shared polish ---------- */
html,body{width:100%;min-width:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overflow:hidden}
.frame{min-width:0}
.main{min-height:0;min-width:0;height:100%}
.scroll{min-height:0;min-width:0}
.input,.note{flex-shrink:0}
.field{box-shadow:-6px 4px 20px rgba(106,160,255,.24),6px 4px 20px rgba(244,114,182,.16),0 -4px 20px rgba(167,139,250,.15);transition:box-shadow .25s ease,background .2s ease}
.field:focus-within{box-shadow:-6px 4px 24px rgba(106,160,255,.34),6px 4px 24px rgba(244,114,182,.23),0 -4px 24px rgba(167,139,250,.22)}
.busy .field{animation:glow 2.4s ease-in-out infinite}
.msg.u{background:linear-gradient(180deg,#7fa9ff,#5b8df0);color:#fff}
.empty p{margin:0;color:var(--mute)}
.mbar,.menubtn{display:none}

/* ---------- balanced visual polish + motion ---------- */
button,.chat,.model,.mi,.pbtn,.round,.new,.gear,.menubtn,.mnew,.logo,.expand,.more,.bar button,.key button,.mh button{transition:background-color .18s ease,color .18s ease,box-shadow .2s ease,transform .18s ease,opacity .18s ease}
button:not(:disabled):active,.chat:not(.edit):active{transform:scale(.97)}
.chat:not(.edit):hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(0,0,0,.045)}
.chat.on:hover{box-shadow:inset 0 0 0 1px #aaa,0 3px 10px rgba(0,0,0,.045)}
.round:not(:disabled):hover,.new:hover,.gear:hover,.menubtn:hover,.mnew:hover{transform:translateY(-1px)}
.round:not(:disabled):active,.new:active,.gear:active,.menubtn:active,.mnew:active{transform:scale(.95)}
.field:focus-within{border-color:rgba(106,160,255,.42)}
.field textarea::placeholder{color:#858585;opacity:1}
.msg{animation:messageIn .24s cubic-bezier(.2,.75,.25,1) both}
.msg.u{transform-origin:bottom right}
.msg:not(.u){transform-origin:bottom left}
@keyframes messageIn{from{opacity:0;transform:translateY(7px) scale(.992)}to{opacity:1;transform:translateY(0) scale(1)}}
.row{animation:rowIn .22s ease both}
@keyframes rowIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.bar{animation:barIn .2s ease both}

button:focus-visible,.chat:focus-visible,.model:focus-visible{outline:2px solid rgba(76,130,239,.85);outline-offset:3px}

/* ---------- PHONE LAYOUT: tune the numbers here ----------
   --edge        side margin shared by EVERY element (top bar, messages, input, buttons)
   --gap-top     space kept free above the app when it sits inside Google Sites
                 (so the Sites header can't cover the top bar). Raise it if the top bar is
                 hidden, lower it if there is too much blank space.
   --gap-bottom  same, for Safari's bottom bar.
   Opened directly (not inside Sites) these gaps shrink to just the phone's safe area. */
:root{--edge:14px;--bar:52px;--gap-top:env(safe-area-inset-top,0px);--gap-bottom:env(safe-area-inset-bottom,0px)}
html.embedded{--gap-top:max(88px,env(safe-area-inset-top,0px));--gap-bottom:max(32px,env(safe-area-inset-bottom,0px))}

@media (max-width:640px){
 body{height:100dvh;min-height:320px;padding:var(--gap-top) 0 var(--gap-bottom);background:radial-gradient(120% 50% at 50% 108%,rgba(120,150,255,.2),transparent 70%),#fff}
 .frame{width:100%;height:100%;min-height:0;border:0;border-radius:0;padding:0;gap:0;background:transparent}

 /* top bar: both buttons share the same edge and are exactly centered; title is centered on the screen */

 .mt{font-size:17px;font-weight:500;pointer-events:none}.mt b{font-weight:700}

 .menubtn{left:var(--edge)}.mnew{right:var(--edge)}
 .menubtn:hover,.mnew:hover{background:rgba(0,0,0,.1)}

 /* messages */
 .scroll{padding:calc(var(--bar) + 12px) var(--edge) 12px;gap:10px;overscroll-behavior:contain}
 .msg{max-width:86%;min-width:0;background:#f0f0f3;border-radius:20px;padding:10px 15px}
 .msg.u{background:linear-gradient(180deg,#7fa9ff,#5b8df0);color:#fff;border-radius:20px;padding:10px 15px}
 .bar{background:none;padding:0 4px;margin-top:-6px;max-width:100%}.bar span{margin-left:12px;font-size:12px}
 .empty{max-width:100%;padding:12px}.empty h2{font-size:30px}

 /* input row: same side margin as everything else; orb lines up with the send button */
 .input{margin:0 var(--edge);gap:8px;padding-top:6px;min-width:0}
 .field{min-width:0;min-height:48px;padding:0 6px 0 16px;border-radius:24px;background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);border:1px solid rgba(255,255,255,.95)}
 .field textarea{min-width:0;width:0;flex:1;line-height:24px;padding:12px 0;max-height:112px;height:48px}
 .mwrap{flex:none;margin-left:4px}
 .model{max-width:96px;overflow:hidden;font-size:13px;padding:6px 4px;gap:3px}.model .sep{display:none}.model span{overflow:hidden;text-overflow:ellipsis}
 #clip{display:none}
 .round{width:44px;height:44px;margin-bottom:2px;background:rgba(255,255,255,.88);box-shadow:0 2px 12px rgba(106,160,255,.25)}
 .orb{width:46px;height:46px;right:0;bottom:calc(100% + 12px)}
 .pop{width:min(240px,calc(100vw - 2 * var(--edge)));right:0}
 .note{text-align:center;font-size:12px;margin:6px var(--edge) 8px}

 /* chats + settings: full-screen view with the same edge */
 .side{position:absolute;inset:0;z-index:12;width:100%;height:100%;max-width:none;border-radius:0;padding:14px var(--edge) 124px;background:#eeeef2;box-shadow:none;transform:translateX(-101%);visibility:hidden;transition:transform .24s ease,visibility 0s .24s}
 .side.open{transform:none;visibility:visible;transition:transform .24s ease}
 .side .brand{flex:none;margin-bottom:12px;padding:0 2px 12px}.side .brand h1{font-size:25px}
 .side .logo{background:rgba(0,0,0,.07)!important;background-image:none!important}
 .side.open #logo::after{content:"×";display:block;font-size:27px;line-height:1;color:#333}
 .side .list{flex:1;min-height:0;padding:0 0 14px}
 .side .chat{padding-top:12px;padding-bottom:12px}
 .side .more{opacity:1}
 .side .cmenu{right:var(--edge);z-index:14}
 .side .new,.side .gear{position:absolute;left:var(--edge);right:var(--edge);width:auto;height:44px;display:flex;align-items:center;justify-content:flex-start;gap:10px;padding:0 14px;border:0;border-radius:14px;color:#222;background:#dedee5;box-shadow:none}
 .side .new{bottom:64px}.side .gear{bottom:12px;padding-right:38px}.side .sync-indicator{left:auto;right:var(--edge);bottom:19px;z-index:2}
 .side .new::after{content:"New chat";font-size:15px;font-weight:500}
 .side .gear::after{content:"Settings";font-size:15px;font-weight:500}
 .side .new:hover,.side .gear:hover{background:#d4d4dc}
 .modal{padding:10px}.mcard{width:min(420px,100%);max-height:calc(100% - 20px);padding:16px}.key{font-size:22px}
}
@media (max-width:360px){
 :root{--edge:10px}
 .round{width:40px;height:40px}.model{max-width:84px;font-size:12px}
}
@media (max-height:480px) and (max-width:640px){
 :root{--bar:46px}
 .menubtn,.mnew{width:32px;height:32px}
}

/* ---------- iOS Safari zooms in when a text field renders under 16px. 18px leaves headroom in case the
   page around the embed (Google Sites) is slightly zoomed out. ---------- */
@media (max-width:640px),(hover:none) and (pointer:coarse){
 input,textarea,select,.field textarea,.mcard .join input,.list .rn{font-size:18px!important}
}
</style>
</head>
<body>
<div class="frame">
 <aside class="side" id="side">
  <div class="brand"><h1>WHW<b>ai</b></h1><button class="logo" id="logo" title="Collapse sidebar" aria-label="Collapse sidebar"></button></div>
  <div class="list" id="list"></div>
  <button class="new" id="new" title="New chat" aria-label="New chat">+</button>
  <button class="gear" id="gear" title="Settings" aria-label="Settings"></button>
  <button class="sync-indicator" id="sync-indicator" title="Sync now" aria-label="Sync now" hidden></button>
  <div class="cmenu" id="cmenu" role="menu" hidden><button id="cren" role="menuitem"></button><button id="cpin" role="menuitem"></button><button id="cdel" class="danger" role="menuitem"></button></div>
 </aside>
 <div class="scrim" id="scrim"></div>
 <div class="modal" id="modal" hidden><div class="mcard" role="dialog" aria-label="Settings"><div class="mh"><b id="modal-title">Settings</b><button id="mx" aria-label="Close">&times;</button></div><div id="mbody"></div></div></div>
 <section class="main">
  <button class="expand" id="expand" title="Show sidebar" aria-label="Show sidebar"></button>
  <div class="mbar"><button class="menubtn" id="mopen" title="Open chats and settings" aria-label="Open chats and settings" aria-expanded="false"></button><span class="mt">WHW<b>ai</b></span><button class="mnew" id="mnew" title="New chat" aria-label="New chat"></button></div>
  <div class="scroll" id="chat"></div>
  <div class="toast" id="toast" role="status"></div>
  <div class="input">
   <div class="orb" id="orb" aria-hidden="true"></div>
   <div class="field">
    <textarea id="in" rows="1" placeholder="Message WHWai" aria-label="Message"></textarea>
    <div class="mwrap">
     <button class="model" id="model" aria-haspopup="menu" aria-expanded="false"></button>
     <div class="pop" id="pop" role="menu" hidden>
      <div class="ph">Model</div>
      <button class="mi" id="mi" role="menuitemradio" aria-checked="true"><div>Aries<small>Powered by OpenAI</small></div><i id="tick"></i></button>
     </div>
    </div>
   </div>
   <button class="round" id="clip" title="Attach" aria-label="Attach"></button>
   <button class="round" id="send" title="Send" aria-label="Send"></button>
  </div>
  <div class="note">WHW<b>ai</b> is not human and can make mistakes.</div>
 </section>
</div>

function md(s){
 const normalize=t=>String(t||"")
  .replace(/\r\n?/g,"\n")
  .replace(/&(?:#x0*20|#0*32|nbsp);/gi," ")
  .replace(/[ \t]*\\[ \t]*(?=\n|$)/g,"")
  .replace(/(^|\n)[ \t]*\\([*-])[ \t]+/g,"$1$2 ")
  .replace(/\\([*_`-])/g,"$1")
  .replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g,"$1$2");
 const inl=t=>esc(t).replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
 const blocks=t=>t.split(/\n\n+/).filter(b=>b.trim()).map(b=>{
  const html=[];let para=[],items=[];
  const flushPara=()=>{if(para.length){html.push("<p>"+para.map(inl).join("<br>")+"</p>");para=[]}};
  const flushList=()=>{if(items.length){html.push("<ul>"+items.map(l=>"<li>"+inl(l.replace(/^[-*]\s+/,""))+"</li>").join("")+"</ul>");items=[]}};
  b.split("\n").forEach(line=>{
   if(/^\s*[-*]\s+/.test(line)){flushPara();items.push(line.trim())}
   else{flushList();para.push(line)}
  });
  flushList();flushPara();return html.join("");
 }).join("");
 return String(s||"").split(/```[\w+-]*\n?([\s\S]*?)(?:```|$)/).map((p,i)=>i%2?"<pre>"+esc(p.replace(/\n+$/,""))+"</pre>":blocks(normalize(p))).join("");
}

 const d=Math.floor(h/24);if(d<7)return d+(d===1?" day ago":" days ago");
 return new Date(t).toLocaleDateString();
}

function renderPrivacyPolicy(){

 <p class="sm">Effective date: October 11, 2026</p>
 <h3>What WHWai stores</h3><p>Chats, replies, titles, and related chat data are stored in your browser so they remain available when you return. If you enable sync, WHWai sends chat data to its Google Apps Script backend, which stores it in Google Sheets. A six-digit sync key connects devices; a random browser identifier helps count and manage synced devices. Keep the key private and avoid sharing sensitive information.</p>
 <h3>How data is used</h3><p>WHWai uses conversations to display chats, sync and restore them, and generate requested replies and titles. Authorized WHW personnel may access synced data when reasonably needed for support, service maintenance, security response, or legal compliance. WHW does not intend to sell conversations, use them for advertising or profiling, or train its own models on them.</p>
 <h3>Services and AI processing</h3><p>WHWai is displayed through Google Sites; its page is hosted on GitHub Pages, loads Inter from Google Fonts, and uses Google Apps Script, Google Sheets, and Groq. These providers may receive connection information and process data under their own policies. WHWai sends prompts and recent conversation context (up to 14 messages) to Groq for responses and title generation. The current models are OpenAI open-weight gpt-oss models running on Groq; requests go to Groq, not directly to OpenAI.</p>
 <p>Groq says it collects usage metadata and generally does not retain ordinary inference prompts and outputs by default, but may temporarily log inputs and outputs for reliability or suspected-abuse investigations for up to 30 days. WHWai's code cannot verify whether Zero Data Retention is enabled for its account. See <a href="https://console.groq.com/docs/your-data" target="_blank" rel="noopener noreferrer">Groq's data documentation</a> and <a href="https://console.groq.com/docs/legal/services-agreement" target="_blank" rel="noopener noreferrer">Services Agreement</a>.</p>
 <h3>Sync, deletion, and downloads</h3><p>Chats saved only on a device remain there until deleted or browser data is cleared. Sync deletion can remove the server copy and, where selected, mark tracked devices to erase local chats the next time they reconnect. The server cannot immediately contact offline devices, and devices that are untracked or do not reconnect may retain local data. Turning sync off on one device does not delete the server copy.</p>
 <p>Export creates a ZIP from this browser's local chats. The sync key and browser identifier are not included. Keep exports private; deleting chats in WHWai does not delete ZIPs or extracted files. Server deletion does not erase Google Sheets version history or data that third parties may retain.</p>
 <h3>Security and contact</h3><p>WHW intends to take reasonable steps to protect conversation data, but no online service can guarantee complete security. If a serious security issue is identified, WHW will investigate and take appropriate protective steps, which may include disabling sync or deleting active server data. For privacy questions or support, contact <a href="mailto:wehatewindows.help@gmail.com">wehatewindows.help@gmail.com</a>.</p>
 <p class="sm">This policy may change as WHWai's features, providers, or data practices change.</p><div class="btns"><button class="pbtn" id="privacy-back">Back to Settings</button></div>`;

}
