 .menubtn{left:var(--edge)}.mnew{right:var(--edge)}

 .msg.u{background:linear-gradient(180deg,#7fa9ff,#5b8df0);color:#fff;border-radius:20px;padding:10px 15px}
 .bar{background:none;padding:0 4px;margin-top:-6px;max-width:100%}.bar span{margin-left:12px;font-size:12px}
 .empty{max-width:100%;padding:12px}.empty h2{font-size:30px}

 
 .input{margin:0 var(--edge);gap:8px;padding-top:6px;min-width:0}
 .field{min-width:0;min-height:48px;padding:0 6px 0 16px;border-radius:24px;background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);border:1px solid rgba(255,255,255,.95)}
 .field textarea{min-width:0;width:0;flex:1;line-height:24px;padding:12px 0;max-height:112px;height:48px}
 .mwrap{flex:none;margin-left:4px;gap:2px}
 .model{max-width:88px;overflow:hidden;font-size:13px;padding:6px 4px;gap:3px}.model .sep{display:none}.model span{overflow:hidden;text-overflow:ellipsis}
 .info-pop{width:min(270px,calc(100vw - 40px))}
 .round{width:44px;height:44px;margin-bottom:2px;background:rgba(255,255,255,.88);box-shadow:0 2px 12px rgba(106,160,255,.25)}
 .orb{width:46px;height:46px;right:0;bottom:calc(100% + 12px)}
 .pop{width:min(240px,calc(100vw - 2 * var(--edge)));right:0}
 .note{text-align:center;font-size:12px;margin:6px var(--edge) 8px}

 
 .side{position:absolute;inset:0;z-index:12;width:100%;height:100%;max-width:none;border-radius:0;padding:14px var(--edge) 124px;background:#eeeef2;box-shadow:none;transform:translateX(-101%);visibility:hidden;transition:transform .24s ease,visibility 0s .24s}
 .side.open{transform:none;visibility:visible;transition:transform .24s ease}
 .side .brand{flex:none;margin-bottom:12px;padding:0 2px 12px}.side .brand h1{font-size:25px}
 .side .logo{background:rgba(0,0,0,.07)!important;background-image:none!important}
 .side.open #logo::after{content:"×";display:block;font-size:27px;line-height:1;color:#333}
 .side .list{flex:1;min-height:0;padding:0 0 14px}
 .side .chat{padding-top:12px;padding-bottom:12px}
 .side .more{opacity:1}
 .side .cmenu{right:var(--edge);z-index:14}
 .side .new,.side .gear{position:absolute;left:var(--edge);right:var(--edge);width:auto;height:44px;display:flex;align-items:center;justify-content:flex-start;gap:10px;padding:0 14px;border:0;border-radius:14px;color:#222;background:#dedee5;box-shadow:none}
 .side .new{bottom:64px}.side .gear{bottom:12px;padding-right:38px}
 .side .new::after{content:"New chat";font-size:15px;font-weight:500}
 .side .gear::after{content:"Settings";font-size:15px;font-weight:500}
 .side .new:hover,.side .gear:hover{background:#d4d4dc}
 .modal{padding:10px}.mcard{width:min(420px,100%);max-height:calc(100% - 20px);padding:16px}
}

function renderPrivacyPolicy(){

 mbody.innerHTML=`<div class="policy-takeaways"><strong>Key takeaways</strong><ul><li>Guest chats remain in this browser; signed-in chats are stored on the WHWai server to sync across devices.</li><li>Passwords are stored as salted, iterated hashes, not plain text.</li><li>Admins cannot view chat titles, messages, or other chat content through the WHWai admin panel.</li><li>The owner of the underlying Google account and spreadsheet could technically access stored data outside the WHWai interface.</li></ul></div>
 <p class="sm">Effective date: October 17, 2026</p>
 <h3>Guest use and accounts</h3><p>WHWai can be used without an account. Guest chats are stored locally in this browser and do not sync. If you create an account or sign in, the chats currently on the device are merged into your account, and the browser keeps a local cache for display and syncing. Accounts use a username and password; no email address is required. Usernames, salted password hashes, account role/status, creation and sign-in timestamps, session-token hashes, and account chat data are stored in the account spreadsheet. The browser stores the session token so it can reconnect to your account. Sessions expire after 30 days and can be revoked.</p>
 <h3>How data is used</h3><p>Conversation data is used to display, save, restore, and sync chats and to generate replies and titles you request. WHW does not intend to sell conversations, use them for advertising or profiling, or train its own models on them. Admin tools show account metadata and chat counts only. They are designed not to return chat titles, messages, or chat content.</p>
 <h3>Hosting, storage, and access</h3><p>WHWai uses Google Apps Script and a Google spreadsheet to operate its backend and store account/chat data. The owner of the Google account and spreadsheet that host the service could technically access that data directly through Google's tools, independently of the WHWai admin panel. Administrators using the WHWai interface cannot read chat content through admin features. Google and other infrastructure providers may process technical data under their own terms and policies.</p>
 <h3>AI processing</h3><p>WHWai sends the prompt and recent conversation context (up to the latest 14 messages) to Groq to generate replies and chat titles. The models are OpenAI open-weight gpt-oss models running on Groq; requests go to Groq, not directly to OpenAI. Groq's documentation says ordinary inference prompts and outputs are not retained by default, but they may be temporarily logged for system reliability or suspected-abuse investigations for up to 30 days unless legally required longer. Zero Data Retention can prevent this limited retention, but WHWai cannot verify whether it is enabled for this account. See <a href="https://console.groq.com/docs/your-data" target="_blank" rel="noopener noreferrer">Groq's data documentation</a> and its <a href="https://console.groq.com/docs/legal/services-agreement" target="_blank" rel="noopener noreferrer">Services Agreement</a>.</p>
 <h3>Usage limits and security</h3><p>The second model, when enabled, uses a server-enforced daily limit. Guest use is limited per browser and by a shared daily guest pool; signed-in use is limited per account. A separate global daily cap adds protection. Browser identifiers are pseudonymous and can be cleared, so the guest pool and global cap are also used to reduce easy limit circumvention.</p>
 <p>Passwords are never intentionally stored or logged in plain text. Account sessions can be revoked, and temporary passwords issued by an admin expire after 72 hours and must be changed at sign-in. WHW intends to take reasonable steps to protect data, but no online service can guarantee complete security. If a serious security issue is identified, WHW may restrict access, disable accounts or the service, revoke sessions, or delete active server-stored data.</p>

}
async function loadAdminAudit(){
 const box=$("admin-content");box.innerHTML='<p class="sm"><span class="sync-spinner" aria-hidden="true"></span>Loading audit log…</p>';
 try{const r=await post({action:"admin_audit"});if(!r||!r.ok)throw Object.assign(new Error(r&&r.error||"failed"),{payload:r});
  box.innerHTML=`<p class="sm">Latest ${r.entries.length} admin and account-security events. Chat titles and messages are never recorded here.</p>${r.entries.length?r.entries.map(item=>`<article class="admin-audit-item"><strong>${esc(item.action)}</strong><span>${adminDate(item.timestamp)}</span><p>${esc(item.actor)} → ${esc(item.target||"—")}</p><small>${esc(item.detail||"")}</small></article>`).join(""):'<p class="sm">No audit entries yet.</p>'}<button type="button" class="pbtn" id="admin-audit-reload">Refresh</button>`;
  $("admin-audit-reload").onclick=loadAdminAudit;
 }catch(err){box.innerHTML=`<p class="access-error" role="status">${esc(err&&err.payload&&err.payload.message||"Couldn't load the audit log.")}</p><button type="button" class="pbtn" id="admin-audit-retry">Retry</button>`;$("admin-audit-retry").onclick=loadAdminAudit}
}
function finishModalClose(){if(!closingModal)return;if(closeModalTimer!==null){clearTimeout(closeModalTimer);closeModalTimer=null}modal.hidden=true;modal.classList.remove("closing");closingModal=false}
function closeSettings(){if(exportCooldownTicker!==null){clearInterval(exportCooldownTicker);exportCooldownTicker=null}if(modal.hidden||closingModal)return;closingModal=true;modal.classList.add("closing");closeModalTimer=setTimeout(finishModalClose,190)}
function openSettings(){if(closeModalTimer!==null){clearTimeout(closeModalTimer);closeModalTimer=null}closingModal=false;modal.classList.remove("closing");modal.hidden=false;smsg="";renderSettings()}
function gateAdminMode(open){
 const form=$("access-admin-form"),link=$("access-admin-open");form.hidden=!open;link.hidden=!!open;accessForm.hidden=!!open||aiDisabled;accessError.hidden=true;$("access-admin-error").hidden=true;
 if(open){$("access-admin-user").focus()}else if(!aiDisabled)accessInput.focus();
}
$("access-admin-open").onclick=()=>gateAdminMode(true);$("access-admin-back").onclick=()=>gateAdminMode(false);
$("access-admin-form").onsubmit=async e=>{
 e.preventDefault();const username=$("access-admin-user").value.trim().toLowerCase(),password=$("access-admin-password").value,b=$("access-admin-submit"),error=$("access-admin-error");if(!username||!password)return;
 b.disabled=true;b.innerHTML='<span class="sync-spinner" aria-hidden="true"></span>Signing in…';error.hidden=true;
 try{const result=await post({action:"auth_admin_login",username,password});if(!result||!result.ok||!result.token)throw Object.assign(new Error(result&&result.error||"invalid_admin_credentials"),{payload:result});setAccountFromResult(result);$("access-admin-password").value="";accessGate.hidden=true;openApp(true);if(result.user&&result.user.mustChange){openSettings();renderRequiredPasswordChange()}else{openSettings();renderAdminPanel("site")}}
 catch(err){error.textContent=err&&err.payload&&err.payload.message||"Invalid admin username or password.";error.hidden=false}
 finally{b.disabled=false;b.textContent="Sign in"}
};
$("gear").onclick=openSettings;$("mx").onclick=closeSettings;modal.onclick=e=>{if(e.target===modal)closeSettings()};
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&accountSession&&accountSession.token&&!busy)scheduleAccountSync()});
window.addEventListener("online",()=>{if(accountSession&&accountSession.token)scheduleAccountSync()});
setInterval(()=>document.querySelectorAll(".bar span,.cm").forEach(el=>el.textContent=ago(+el.dataset.t)),1000);
renderList();renderChat();renderSiteNotice();
if(accountSession&&accountSession.token)accountReady=false;
const fr=document.querySelector(".frame");fr.classList.add("no-anim");fr.classList.toggle("collapsed",!!S.col);requestAnimationFrame(()=>requestAnimationFrame(()=>fr.classList.remove("no-anim")));

</script>
