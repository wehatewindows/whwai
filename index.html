   v.setUint32(20,data.length,true);v.setUint32(24,data.length,true);v.setUint16(28,name.length,true);v.setUint16(30,0,true);

  const nameStart=offset+30,name=decoder.decode(bytes.slice(nameStart,nameStart+nameLen)),dataStart=nameStart+nameLen+extraLen,dataEnd=dataStart+size;

   if(method!==0)throw new Error("Compressed ZIP not supported");

}

async function runAdminAccountAction(action,targetId){
 const choices={disable:{title:"Disable account?",message:"This account will no longer be able to sign in, and its active sessions will be revoked.",label:"Disable"},enable:{title:"Enable account?",message:"This account will be allowed to sign in again.",label:"Enable",danger:false},reset_password:{title:"Issue temporary password?",message:"A new one-time password will replace the current password and sign out this account everywhere. It expires after 72 hours.",label:"Issue password"},force_signout:{title:"Sign out everywhere?",message:"All active sessions for this account will be revoked.",label:"Sign out all"},promote:{title:"Make administrator?",message:"This account will gain access to administrative controls.",label:"Make admin"},demote:{title:"Remove administrator role?",message:"This account will lose access to administrative controls.",label:"Demote"},delete:{title:"Delete account permanently?",message:"The account and its active server-stored chats will be deleted. This cannot be undone from WHWai.",label:"Delete account"}};
 const choice=choices[action];if(!choice)return;
 const accepted=await appConfirm({title:choice.title,message:choice.message,confirmLabel:choice.label,danger:choice.danger!==false});
 if(!accepted){if(!modal.hidden&&!closingModal)renderAdminPanel("accounts");return}
 if(modal.hidden||currentSettingsView!=="app-confirm")return;
 adminActionPending=true;$("modal-title").textContent="Working…";mbody.innerHTML='<div class="confirm-panel"><span class="choice-icon"><span class="sync-spinner" aria-hidden="true"></span></span><div><strong>Applying admin action…</strong><p>Please keep this window open while WHWai updates the account.</p></div></div>';animateMenuContent();
 try{
  const result=await post({action:"admin_account_action",accountAction:action,targetId:targetId});
  if(!result||!result.ok)throw Object.assign(new Error(result&&result.error||"failed"),{payload:result});
  await adminFetch(true).catch(()=>{});
  if(result.temporaryPassword){renderOneTimePassword("Temporary password",result.username,result.temporaryPassword,result.expiresAt,"accounts");return}
  toast("Account updated.");if(!modal.hidden)renderAdminPanel("accounts");
 }catch(err){toast(err&&err.payload&&err.payload.message||"Couldn't update that account.");if(!modal.hidden)renderAdminPanel("accounts")}
 finally{adminActionPending=false}
}
async function appConfirm(options){
 options=options||{};
 const title=String(options.title||"Confirm action"),message=String(options.message||"Are you sure you want to continue?"),confirmLabel=String(options.confirmLabel||"Continue"),standalone=options.standalone===true&&modal.hidden,dialogGeneration=standalone?++confirmOverlayGeneration:0;
 if(pendingAppConfirmation)resolvePendingConfirmation(false);
 return await new Promise(resolve=>{
  let settled=false;
  const settle=value=>{
   if(settled)return;settled=true;if(pendingAppConfirmation===settle)pendingAppConfirmation=null;
   if(standalone){const overlay=$("confirm-overlay");overlay.classList.remove("open");overlay.classList.add("closing");setTimeout(()=>{if(dialogGeneration===confirmOverlayGeneration){overlay.hidden=true;overlay.classList.remove("closing");overlay.innerHTML="";overlay.onclick=null}resolve(value)},170)}else resolve(value);
  };
  pendingAppConfirmation=settle;
  const icon=ic(options.danger===false?'<path d="M12 3l2.2 4.5 5 .7-3.6 3.5.9 5-4.5-2.4-4.5 2.4.9-5-3.6-3.5 5-.7z"/>':'<path d="M12 3l9 17H3z"/><path d="M12 9v4M12 17h.01"/>',19,1.8);
  const panel=`<div class="confirm-panel"><span class="choice-icon">${icon}</span><div><strong>${esc(title)}</strong><p>${esc(message)}</p></div></div><div class="data-toolbar"><button type="button" class="pbtn" id="app-confirm-cancel">Cancel</button><button type="button" class="pbtn ${options.danger===false?"":"danger"}" id="app-confirm-accept">${esc(confirmLabel)}</button></div>`;
  if(standalone){
   const overlay=$("confirm-overlay");overlay.innerHTML=`<div class="app-confirm-card">${panel}</div>`;overlay.hidden=false;overlay.classList.remove("closing","open");overlay.setAttribute("aria-label",title);
   overlay.onclick=e=>{if(e.target===overlay)settle(false)};
   const card=overlay.querySelector(".app-confirm-card");card.onclick=e=>e.stopPropagation();
   requestAnimationFrame(()=>{if(dialogGeneration===confirmOverlayGeneration)overlay.classList.add("open")});
  }else{
   currentSettingsView="app-confirm";$("modal-title").textContent=title;mbody.innerHTML=panel;animateMenuContent();
  }
  $("app-confirm-cancel").onclick=()=>settle(false);$("app-confirm-accept").onclick=()=>settle(true);$("app-confirm-cancel").focus();
 });
}
let pendingAppConfirmation=null,confirmOverlayGeneration=0;
function resolvePendingConfirmation(value){if(!pendingAppConfirmation)return false;pendingAppConfirmation(value);return true}
function renderOneTimePassword(title,username,password,expiresAt,returnTab){
 currentSettingsView="one-time-password";$("modal-title").textContent=title;
 mbody.innerHTML=`<p><strong>${esc(username||"")}</strong></p><p class="sm">Copy this password now. WHWai will not display it again after you leave this screen. The password expires ${adminDate(expiresAt)} and must be changed at first sign-in.</p><div class="key"><span class="key-value" id="one-time-password-value">${escapeAttr(password||"")}</span><button type="button" id="one-time-password-copy" class="pbtn">Copy</button></div><p class="sm" id="one-time-password-status" role="status"></p><div class="data-toolbar"><button type="button" class="pbtn" id="one-time-password-done">I have saved it</button></div>`;
 $("one-time-password-copy").onclick=async()=>{try{await navigator.clipboard.writeText(password);$("one-time-password-status").textContent="Copied to clipboard."}catch(e){const el=$("one-time-password-value"),range=document.createRange();range.selectNodeContents(el);const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);$("one-time-password-status").textContent="Select the password above and copy it manually."}};
 $("one-time-password-done").onclick=()=>renderAdminPanel(returnTab||"accounts");
}

function finishModalClose(){if(!closingModal)return;if(closeModalTimer!==null){clearTimeout(closeModalTimer);closeModalTimer=null}modal.hidden=true;modal.classList.remove("closing");closingModal=false}
function closeSettings(){if(adminActionPending){toast("Please wait for the admin action to finish.");return}resolvePendingConfirmation(false);if(exportCooldownTicker!==null){clearInterval(exportCooldownTicker);exportCooldownTicker=null}if(modal.hidden||closingModal)return;closingModal=true;modal.classList.add("closing");closeModalTimer=setTimeout(finishModalClose,190)}

function gateAdminMode(open){
 const form=$("access-admin-form"),link=$("access-admin-open");form.hidden=!open;link.hidden=!!open;accessForm.hidden=!!open||aiDisabled;accessError.hidden=true;$("access-admin-error").hidden=true;
 if(open){$("access-admin-user").focus()}else if(!aiDisabled)accessInput.focus();
}

 e.preventDefault();const username=$("access-admin-user").value.trim().toLowerCase(),password=$("access-admin-password").value,b=$("access-admin-submit"),error=$("access-admin-error");if(!username||!password)return;
 b.disabled=true;b.innerHTML='<span class="sync-spinner" aria-hidden="true"></span>Signing in…';error.hidden=true;
 try{const result=await post({action:"auth_admin_login",username,password});if(!result||!result.ok||!result.token)throw Object.assign(new Error(result&&result.error||"invalid_admin_credentials"),{payload:result});setAccountFromResult(result);$("access-admin-password").value="";accessGate.hidden=true;openApp(true);if(result.user&&result.user.mustChange){openSettings();renderRequiredPasswordChange()}else{openSettings(()=>renderAdminPanel("site"))}}
 catch(err){error.textContent=err&&err.payload&&err.payload.message||"Invalid admin username or password.";error.hidden=false}
 finally{b.disabled=false;b.textContent="Sign in"}
};
